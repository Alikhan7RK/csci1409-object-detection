# Run A — baseline. All arguments are passed straight to ultralytics YOLO.train().
# The ONLY difference in exp_imgsz320.yaml is `imgsz` (and the run name).
model: yolo11n.pt            # COCO-pretrained YOLO11 nano (2.6M params)
data: datasets/african-wildlife-clean.yaml
name: baseline
project: runs
imgsz: 640
epochs: 40
patience: 100                # effectively off: both runs train all 40 epochs
batch: 16
optimizer: SGD               # set explicitly ("auto" may pick a different optimizer/lr)
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
cos_lr: false
seed: 42
deterministic: true
workers: 2
cache: false
pretrained: true
plots: true
save: true
exist_ok: true
